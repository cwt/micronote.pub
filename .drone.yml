---
kind: pipeline
name: default
steps:
  - name: lint
    image: python:3.11-slim
    commands:
      - pip install ".[dev]"
      - ruff check .
      - mypy .
      - djlint --lint src/micronote/templates
      - cp tests/fixtures/me.yml config/me.yml
      - python scripts/render_html_fixtures.py --out .html-render
  - name: lint-web
    image: node:22-slim
    commands:
      - npm ci
      - npm run lint:css
      - npm run lint:html
  - name: test
    image: python:3.11-slim
    commands:
      - pip install ".[dev]"
      - cp tests/fixtures/me.yml config/me.yml
      - python -m pytest tests/integration_test.py -v
  - name: docker
    image: docker:dind
    commands:
      - docker build . -t micronote:latest
