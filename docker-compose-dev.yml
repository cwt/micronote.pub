# Dev runs the web app locally (`flask run`, see README); this only
# provides the background worker against the same ./data SQLite file.
services:
  worker:
    image: micronote:latest
    command: 'python -m micronote.worker'
    volumes:
     - "./config:/app/config"
     - "./data:/app/data"
    environment:
     - MICRONOTE_DEBUG=1
