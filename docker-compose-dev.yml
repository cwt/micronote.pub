# Dev runs the web app locally (`flask run`, see README); this only
# provides the background worker against the same ./data SQLite file.
services:
  worker:
    image: microblogpub:latest
    command: 'python worker.py'
    volumes:
     - "./config:/app/config"
     - "./data:/app/data"
    environment:
     - MICROBLOGPUB_DEBUG=1
