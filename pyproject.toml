[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "micronote-pub"
version = "0.1.0"
description = "Self-hosted, single-user, ActivityPub-powered microblog"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}
# Pins are intentional: this is a deployable app, not a library,
# so reproducible installs matter more than flexible ranges.
dependencies = [
    "python-dateutil==2.9.0.post0",
    "gunicorn==26.2.0",
    "requests==2.34.2",
    "fido2==2.2.1",
    "Flask==3.1.3",
    "Flask-WTF==1.3.0",
    "neosqlite==1.16.2",
    "timeago==1.0.16",
    "bleach==6.4.0",
    "html2text==2025.4.15",
    "feedgen==1.0.0",
    "itsdangerous==2.2.0",
    "bcrypt==5.0.0",
    "mf2py==2.0.1",
    "opengraph @ git+https://github.com/erikriver/opengraph.git",
    "active-boxes==0.2.5",
    "pyyaml==6.0.3",
    "pillow==12.3.0",
    "cachetools==7.1.8",
    "emoji==2.15.0",
    "beautifulsoup4==4.15.0",
    "html5lib==1.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "djlint",
]

[project.scripts]
micronote-worker = "micronote.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
micronote = [
    "templates/**/*.html",
    "templates/*.html",
    "static/**/*",
    "static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
ignore_missing_imports = true
